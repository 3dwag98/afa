version: '3.8'

services:
  # One-shot portfolio agent service (default profile)
  portfolio-agent:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: portfolio-agent-airflow:latest
    environment:
      PYTHONPATH: /opt/airflow/project
      TZ: Asia/Kolkata
    volumes:
      - ./src:/opt/airflow/project/src:ro
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    working_dir: /opt/airflow/project
    command: python main.py
    profiles:
      - default

  # Test service (default profile)
  test:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: portfolio-agent-airflow:latest
    environment:
      PYTHONPATH: /opt/airflow/project
      TZ: Asia/Kolkata
    volumes:
      - ./src:/opt/airflow/project/src:ro
      - ./tests:/opt/airflow/project/tests:ro
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    working_dir: /opt/airflow/project
    entrypoint: pytest
    command: tests -v
    profiles:
      - default

  # PostgreSQL database for Airflow (airflow profile only)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - airflow

  # Airflow initialization service (airflow profile only)
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: portfolio-agent-airflow:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
      - ./airflow/scripts/airflow-init.sh:/opt/airflow/scripts/airflow-init.sh:ro
    command: bash /opt/airflow/scripts/airflow-init.sh
    profiles:
      - airflow

  # Airflow webserver (airflow profile only)
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: portfolio-agent-airflow:latest
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      TZ: Asia/Kolkata
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    ports:
      - "8080:8080"
    command: airflow webserver
    profiles:
      - airflow

  # Airflow scheduler (airflow profile only)
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: portfolio-agent-airflow:latest
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    command: airflow scheduler
    profiles:
      - airflow

  # Airflow test service for running pytest in Airflow environment (airflow profile only)
  airflow-test:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: portfolio-agent-airflow:latest
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./tests:/opt/airflow/project/tests
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    entrypoint: pytest
    command: tests -v
    profiles:
      - airflow

volumes:
  postgres_data:
