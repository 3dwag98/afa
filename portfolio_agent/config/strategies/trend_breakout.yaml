# Trend + Breakout + Volume + Monte Carlo Strategy
# 
# This strategy implements the hardcoded scoring logic from the original agent
# as a configurable rule-based strategy.

name: "Trend Breakout Volume MC"
description: "Combines trend following, breakout detection, volume confirmation, and Monte Carlo probability"
version: "1.0"

# Entry conditions - all must be true for a BUY signal
entry:
  description: "All conditions must be met for entry"
  conditions:
    - field: "close"
      operator: ">"
      reference_field: "sma_200"
      description: "Price above 200-day SMA"
    
    - field: "close"
      operator: ">"
      reference_field: "sma_50"
      description: "Price above 50-day SMA"
    
    - field: "close"
      operator: ">"
      reference_field: "donchian_upper_20"
      description: "Price broke out above previous Donchian upper band"

    - field: "volume_ratio_20"
      operator: ">"
      value: 1.5
      description: "Volume ratio above 1.5x average"

# Exit rules (stop loss and take profit)
exit:
  description: "Risk management rules based on ATR"
  stop_loss:
    type: "atr_multiple"
    multiplier: 1.5
    description: "Stop loss at 1.5x ATR below entry"
  take_profit:
    type: "atr_multiple"
    multiplier: 3.0
    # Widened from 2.0x once reward:risk started being measured net of
    # round-trip friction (~0.79% of turnover). A 1.5x/2.0x structure is 1.33
    # gross but only 0.72-1.11 net depending on how large ATR is relative to
    # price — i.e. the trade cannot clear any sensible gate after costs.
    # 1.5x/3.0x is 2.0 gross and ~1.2-1.7 net over the same ATR range.
    description: "Take profit at 3.0x ATR above entry (2:1 gross, ~1.4:1 net of costs)"

# Scoring weights (should sum to 100)
scoring:
  description: "Weights for each scoring component"
  # weighted_sum | rank_composite.
  #
  # weighted_sum adds four incommensurable quantities onto a shared 0-100
  # scale: an ordinal on three levels (trend), a binary (breakout), a
  # right-skewed continuous (volume) and — once the Monte Carlo drift is
  # shrunk — a near-constant with a standard deviation around 0.05
  # (model_probability).
  #
  # rank_composite converts each component to its percentile rank across the
  # eligible universe on that date before weighting, which makes them
  # commensurable by construction and invariant to each one's marginal
  # distribution: express volume as a ratio or its logarithm and the composite
  # is unchanged.
  #
  # What it does NOT fix, though it is often proposed as the remedy: a
  # near-constant component still consumes its full share of the budget.
  # Ranking ties hands every name the same percentile, so model_probability
  # contributes a flat number under either method. Making influence track
  # discrimination needs dispersion- or IC-weighted weights, a change to the
  # weight learner; lowering model_probability's weight below is the blunt
  # version available today.
  #
  # It also changes what the entry thresholds MEAN. Under weighted_sum,
  # `score >= 60` is an absolute quality bar that nothing need clear on a bad
  # day. Under rank_composite it is a percentile, so a roughly fixed share of
  # the universe clears it whatever the market is doing — the score stops
  # being a quality filter and becomes a ranker, and the absolute gates
  # (probability of profit, net reward:risk, price, and the regime layer) are
  # what remain to say "not today". Left on weighted_sum by default for that
  # reason; switching is a deliberate change of strategy, not a bug fix.
  method: weighted_sum
  weights:
    trend: 25.0           # Weight for trend score
    breakout: 25.0        # Weight for breakout score  
    volume: 20.0          # Weight for volume score
    model_probability: 30.0  # Weight for Monte Carlo probability score
