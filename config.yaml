# Portfolio Agent Configuration
# These values can be overridden by environment variables with AFA_ prefix
# Example: AFA_TRAINING__DEVICE="cuda" overrides training.device

# Data configuration
data:
  data_dir: data
  market_data_dir: data/market_data
  default_history_years: 5
  universe_size: 10

# Features configuration
features:
  lookbacks:
    short: 5
    medium: 20
    long: 60
  normalize: true
  feature_sets:
    price:
      - open
      - high
      - low
      - close
      - volume
    technical:
      - rsi
      - macd
      - bollinger
    fundamental:
      - pe_ratio
      - market_cap
      - dividend_yield

# Strategy configuration
strategy:
  enabled: true
  module: portfolio_agent.strategies
  config_path: strategies/default.yaml
  params: {}

# Training configuration
training:
  model: lstm
  target: return_5d
  sequence_length: 60
  train_fraction: 0.8
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  device: auto
  use_mixed_precision: true
  num_workers: 4

# Backtest configuration
backtest:
  initial_capital: 1000000.0
  start_years_ago: 5
  use_trained_model: false
  model_path: ""

# Risk configuration
risk:
  portfolio_value_inr: 308733.0
  risk_per_trade_pct: 0.01
  max_single_position_pct: 0.03
