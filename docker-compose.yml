# Docker Compose for AFA (Autonomous Financial Advisor)
# Cross-platform compatible (Windows, macOS, Linux)

services:
  # Live agent service
  agent:
    build: .
    image: afa-app:latest
    container_name: afa-agent
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["python", "main.py"]
    restart: "no"

  # Backtest service
  backtest:
    build: .
    image: afa-app:latest
    container_name: afa-backtest
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["python", "run_backtest.py"]
    restart: "no"

  # Test service
  test:
    build: .
    image: afa-app:latest
    container_name: afa-test
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./output:/app/output
      - ./logs:/app/logs
      - ./tests:/app/tests
    entrypoint: ["pytest"]
    command: ["tests", "-v"]
    restart: "no"

  # Airflow PostgreSQL database (profile: airflow)
  postgres:
    profiles: ["airflow"]
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Airflow initialization service (profile: airflow)
  airflow-init:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./run_backtest.py:/opt/airflow/project/run_backtest.py:ro
      - ./main.py:/opt/airflow/project/main.py:ro
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    command: >
      bash -c "
        pip install --no-cache-dir -r /opt/airflow/project/requirements.txt &&
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "

  # Airflow webserver (profile: airflow)
  airflow-webserver:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./run_backtest.py:/opt/airflow/project/run_backtest.py:ro
      - ./main.py:/opt/airflow/project/main.py:ro
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
      - ./airflow/logs:/opt/airflow/logs
    command: >
      bash -c "
        pip install --no-cache-dir -r /opt/airflow/project/requirements.txt &&
        airflow webserver
      "

  # Airflow scheduler (profile: airflow)
  airflow-scheduler:
    profiles: ["airflow"]
    image: apache/airflow:2.10.4-python3.11
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./run_backtest.py:/opt/airflow/project/run_backtest.py:ro
      - ./main.py:/opt/airflow/project/main.py:ro
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
      - ./airflow/logs:/opt/airflow/logs
    command: >
      bash -c "
        pip install --no-cache-dir -r /opt/airflow/project/requirements.txt &&
        airflow scheduler
      "

volumes:
  postgres_data:
