# Docker Compose for AFA (Autonomous Financial Advisor)
# Cross-platform compatible (Windows, macOS, Linux)
# Modern format with GPU support, uv package manager, and service profiles

# YAML anchor for GPU configuration to avoid repetition
x-gpu-config: &gpu-config
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # Live agent service (profile: default)
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: afa-app:latest
    container_name: afa-agent
    profiles: ["default"]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["python", "-m", "portfolio_agent.cli", "run-agent"]
    restart: "no"

  # Backtest service (profile: default)
  backtest:
    build:
      context: .
      dockerfile: Dockerfile
    image: afa-app:latest
    container_name: afa-backtest
    profiles: ["default"]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["python", "-m", "portfolio_agent.cli", "backtest"]
    restart: "no"

  # Train service (profile: default, GPU-enabled)
  train:
    <<: *gpu-config
    build:
      context: .
      dockerfile: Dockerfile
    image: afa-app:latest
    container_name: afa-train
    profiles: ["default"]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./logs:/app/logs
    command: ["python", "-m", "portfolio_agent.cli", "train"]
    restart: "no"

  # Test service (profile: default)
  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: afa-app:latest
    container_name: afa-test
    profiles: ["default"]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Kolkata
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./models:/app/models
      - ./output:/app/output
      - ./logs:/app/logs
    entrypoint: ["pytest"]
    command: ["tests", "-v"]
    restart: "no"

  # Airflow PostgreSQL database (profile: airflow)
  postgres:
    profiles: ["airflow"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Airflow initialization service (profile: airflow)
  airflow-init:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: afa-airflow:latest
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com
      "

  # Airflow webserver (profile: airflow)
  airflow-webserver:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: afa-airflow:latest
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: 8080
      PYTHONPATH: /opt/airflow/project
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
      - ./airflow/logs:/opt/airflow/logs
    command: airflow webserver

  # Airflow scheduler (profile: airflow, GPU-enabled)
  airflow-scheduler:
    <<: *gpu-config
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: afa-airflow:latest
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - ./config.yaml:/opt/airflow/project/config.yaml:ro
      - ./data:/opt/airflow/project/data
      - ./models:/opt/airflow/project/models
      - ./output:/opt/airflow/project/output
      - ./logs:/opt/airflow/project/logs
      - ./airflow/logs:/opt/airflow/logs
    command: airflow scheduler

volumes:
  postgres_data:
