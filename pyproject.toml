[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Autonomous Financial Advisor (AFA) portfolio agent"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "xlsxwriter>=3.0.0",
    "openpyxl>=3.0.0",
    "pytest>=7.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "pyarrow>=10.0.0",
    "pydantic>=2.0.0",
    "arch>=6.0.0",
    # Used directly by src/performance_stats.py (normal/rank/binomial
    # distributions for PSR, DSR, PBO and the rank IC). Already an `arch`
    # dependency; declared here because it is imported in our own code.
    "scipy>=1.10.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
# Historical OHLCV from a versioned HuggingFace Hub dataset
# (data.source: huggingface). Optional so an offline or yfinance-only install
# stays lean.
hf = [
    "huggingface_hub>=0.20.0",
]

[project.scripts]
portfolio-agent = "portfolio_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_agent"]
