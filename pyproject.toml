[project]
name = "portfolio-agent"
version = "0.1.0"
description = "Autonomous Financial Advisor (AFA) portfolio agent"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.0",
    "xlsxwriter>=3.0.0",
    "openpyxl>=3.0.0",
    "pytest>=7.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "pyarrow>=10.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

[project.scripts]
portfolio-agent = "portfolio_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portfolio_agent"]
